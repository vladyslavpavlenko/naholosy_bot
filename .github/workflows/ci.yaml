name: CI

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run linters
        run: task lint

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run gofumpt
        run: task format

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run unit tests
        run: task go:test:unit

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Auto-build project
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL queries
        uses: github/codeql-action/analyze@v3