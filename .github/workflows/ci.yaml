name: CI

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run linters
        run: task lint

  gofumpt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run gofumpt
        run: task gofumpt

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          go-version-file: go.mod
          check-latest: true
          task-version: '3.x'

      - name: Run unit tests
        run: task test:unit

  migration-test:
    name: Flyway Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d test_db; do
            sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run Flyway migrate
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/sql":/flyway/sql \
            --network host \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/test_db \
            -e FLYWAY_USER=postgres \
            -e FLYWAY_PASSWORD=postgres \
            flyway/flyway:latest-alpine migrate

  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Auto-build project
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL queries
        uses: github/codeql-action/analyze@v3