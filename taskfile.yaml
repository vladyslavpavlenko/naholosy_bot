version: '3'

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list-all

  lint:
    desc: "Run golangci-lint"
    deps: [ install:lint ]
    cmds:
      - echo "Running linters..."
      - golangci-lint run
    sources:
      - .golangci.yml
      - ./**/*.go
      - go.mod
      - go.sum

  gofumpt:
    desc: "Run gofumpt"
    deps: [ install:gofumpt ]
    cmds:
      - echo "Running gofumpt..."
      - gofumpt -e -l -w .

  test:unit:
    desc: "Run unit tests"
    cmds:
      - echo "Running unit tests..."
      - go test ./... -v -tags='!func_test'

  run:
    desc: "Run service"
    deps: [ install:godotenv ]
    required:
      vars:
        - TOKEN
        - LOG_LEVEL
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
        - ADMIN_IDS
    cmds:
      - godotenv -f .env go run ./main

  run:test:
    desc: "Run service with docker"
    deps: [ install:godotenv ]
    required:
      vars:
        - TOKEN
        - LOG_LEVEL
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
        - ADMIN_IDS
    cmds:
      - docker compose up -d
      - godotenv -f .env go run ./main

  install:
    desc: "Install all tools"
    deps:
      - install:lint
      - install:gofumpt
      - install:godotenv

  install:lint:
    desc: "Install golangci-lint"
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    status:
      - command -v golangci-lint

  install:gofumpt:
    desc: "Install gofumpt"
    cmds:
      - go install mvdan.cc/gofumpt@latest
    status:
      - command -v gofumpt

  install:godotenv:
    desc: "Install godotenv"
    cmds:
      - go install github.com/joho/godotenv/cmd/godotenv@latest
    status:
      - command godotenv